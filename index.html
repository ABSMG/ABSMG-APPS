<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <title>Nodysom AI — Plan Your Day. Live Smarter.</title>

    <meta
      name="description"
      content="Nodysom AI is your intelligent daily life assistant for routines, planning, tasks, learning, goals, and everyday productivity."
    />

    <meta
      name="keywords"
      content="Nodysom AI, AI planner, daily routine, daily planner, life assistant, productivity, AI assistant"
    />

    <meta name="theme-color" content="#0F172A" />

    <!-- PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Nodysom AI" />

    <!-- Apple -->
    <meta
      name="apple-mobile-web-app-title"
      content="Nodysom AI"
    />
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- Social sharing -->
    <meta property="og:title" content="Nodysom AI" />
    <meta
      property="og:description"
      content="Plan your day. Live smarter."
    />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA Manifest -->
    <link
      rel="manifest"
      href="/manifest.webmanifest"
    />

    <!-- Icons -->
    <link
      rel="icon"
      href="/icons/icon-192.png"
      type="image/png"
    />

    <link
      rel="apple-touch-icon"
      href="/icons/icon-192.png"
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body
    class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500/30 selection:text-indigo-200 min-h-screen"
  >
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
