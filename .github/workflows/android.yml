name: Nodysom AI Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    name: Build Nodysom AI Android AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Enable npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web application
        run: npm run build

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7.4.4 @capacitor/android@7.4.4 --no-audit --no-fund
          npm install --save-dev @capacitor/cli@7.4.4 --no-audit --no-fund

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.nodysom.ai',
            appName: 'Nodysom AI',
            webDir: 'dist',

            server: {
              url: 'https://absmg-apps.onrender.com',
              cleartext: false
            },

            android: {
              allowMixedContent: false
            }
          };

          export default config;
          EOF

      - name: Create Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;35.0.0"

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Configure Android API 36
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for path in [
              Path("android/variables.gradle"),
              Path("android/build.gradle"),
              Path("android/app/build.gradle")
          ]:
              if path.exists():
                  text = path.read_text()

                  replacements = {
                      "compileSdkVersion = 35": "compileSdkVersion = 36",
                      "targetSdkVersion = 35": "targetSdkVersion = 36",
                      "compileSdkVersion 35": "compileSdkVersion 36",
                      "targetSdkVersion 35": "targetSdkVersion 36",
                      "compileSdk 35": "compileSdk 36",
                      "targetSdk 35": "targetSdk 36"
                  }

                  for old, new in replacements.items():
                      text = text.replace(old, new)

                  path.write_text(text)
          PY

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build Release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Verify AAB
        run: |
          echo "Checking AAB..."
          find android/app/build/outputs -name "*.aab" -print
          test -f android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Nodysom-AI-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
