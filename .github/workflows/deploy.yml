name: Nodysom AI CI + Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nodysom-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build, Test & Deploy Nodysom AI
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5

      # --------------------------------------------------
      # 2. Setup Node.js
      # --------------------------------------------------
      # package-lock.json haipo kwa sasa, hivyo
      # npm cache imezimwa intentionally.
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      # --------------------------------------------------
      # 3. Show Node / npm versions
      # --------------------------------------------------
      - name: Check Node.js and npm
        run: |
          node --version
          npm --version

      # --------------------------------------------------
      # 4. Install dependencies
      # --------------------------------------------------
      # Tunatumia npm install badala ya npm ci
      # kwa sababu package-lock.json bado haipo.
      # --------------------------------------------------
      - name: Install dependencies
        run: npm install

      # --------------------------------------------------
      # 5. Verify Experiential Labs API key
      # --------------------------------------------------
      # Secret lazima iitwe:
      # EXPLABS_API_KEY
      #
      # Usiiweke key moja kwa moja kwenye code.
      # --------------------------------------------------
      - name: Verify Experiential Labs secret
        env:
          EXPLABS_API_KEY: ${{ secrets.EXPLABS_API_KEY }}
        run: |
          if [ -z "$EXPLABS_API_KEY" ]; then
            echo "ERROR: EXPLABS_API_KEY is missing."
            echo "Add EXPLABS_API_KEY under GitHub repository Secrets."
            exit 1
          fi

          echo "EXPLABS_API_KEY is configured."

      # --------------------------------------------------
      # 6. TypeScript validation
      # --------------------------------------------------
      - name: TypeScript check
        run: npm run lint

      # --------------------------------------------------
      # 7. Production build
      # --------------------------------------------------
      - name: Build Nodysom AI
        run: npm run build

      # --------------------------------------------------
      # 8. Verify build output
      # --------------------------------------------------
      - name: Verify build output
        run: |
          if [ ! -f "dist/server.cjs" ]; then
            echo "ERROR: dist/server.cjs was not created."
            exit 1
          fi

          echo "Build output verified:"
          ls -lah dist/

      # --------------------------------------------------
      # 9. Trigger Render deployment
      # --------------------------------------------------
      # Secret lazima iitwe:
      # RENDER_DEPLOY_HOOK_URL
      # --------------------------------------------------
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RE
